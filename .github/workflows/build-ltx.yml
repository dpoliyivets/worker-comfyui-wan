name: Build LTX serverless images (baked weights, split by is_nsfw)

# Builds the two baked-weights LTX-2.3 serverless worker images from
# Dockerfile.ltx — one per LTX_VARIANT (sfw = official dev-fp8, nsfw = 10Eros).
# Each image bakes its single 22B checkpoint + the shared encoder/LoRAs/upscaler
# + the 4 NSFW LoRAs (~35-42 GB), so a scale-to-zero RunPod worker needs no
# runtime weight download in any region.
#
# Manual only (a 40 GB build is not something to run on every push). The R2
# access/secret keys arrive as BuildKit secrets (never baked into a layer); the
# R2 endpoint/bucket are non-sensitive build-args. Pushes to Docker Hub
# ${DOCKERHUB_REPO}/${DOCKERHUB_IMG}:ltx-<variant>-<tag>.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (default: short commit SHA)"
        required: false
        type: string

jobs:
  build-ltx:
    runs-on: [blacksmith-8vcpu-ubuntu-2204, linux]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [sfw, nsfw]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk (a baked 22B-checkpoint image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: blacksmith docker layer cache
        uses: useblacksmith/build-push-action@v1
        with:
          setup-only: true

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          echo "image=${{ vars.DOCKERHUB_REPO }}/${{ vars.DOCKERHUB_IMG }}:ltx-${{ matrix.variant }}-${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push LTX ${{ matrix.variant }} image
        uses: useblacksmith/build-push-action@v1
        with:
          context: .
          file: Dockerfile.ltx
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            LTX_VARIANT=${{ matrix.variant }}
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
          secrets: |
            r2_access_key=${{ secrets.R2_ACCESS_KEY_ID }}
            r2_secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Print pushed image
        run: echo "Pushed ${{ steps.meta.outputs.image }}"
