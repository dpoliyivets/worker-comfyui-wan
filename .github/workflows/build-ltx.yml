name: Build LTX serverless images (baked weights, split by is_nsfw)

# Builds the two baked-weights LTX-2.3 serverless worker images from
# Dockerfile.ltx — one per LTX_VARIANT (sfw = official dev-fp8, nsfw = 10Eros).
# Runs on GitHub-hosted ubuntu-latest runners (real Linux + fast datacenter
# network), NOT Blacksmith (its runner connection can be down) and NOT a Mac
# (Docker Desktop's VM network bridge drops the 29 GB single-layer upload — the
# whole reason we build here instead of locally).
#
# Disk: a ~62 GB image won't fit a stock runner's ~29 GB free root, so
# maximize-build-space carves an ~80 GB LVM volume (from the removed preinstalled
# SDKs) and mounts it at /var/lib/docker. Each matrix leg (sfw/nsfw) gets its own
# runner, so only one 62 GB image is ever on a single runner's disk.
#
# Secrets: R2 keys arrive as BuildKit build-secrets (never baked into a layer);
# R2 endpoint/bucket + LTX_VARIANT are build-args. Docker Hub creds from repo
# secrets. Manual only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (default: short commit SHA)"
        required: false
        type: string

jobs:
  build-ltx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [nsfw, sfw]

    steps:
      - name: Maximize build disk space (~80 GB LVM at /var/lib/docker)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          overprovision-lvm: "true"
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker"

      - name: Restart docker onto the enlarged volume
        run: sudo service docker restart

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          echo "image=${{ vars.DOCKERHUB_REPO }}/${{ vars.DOCKERHUB_IMG }}:ltx-${{ matrix.variant }}-${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push LTX ${{ matrix.variant }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ltx
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            LTX_VARIANT=${{ matrix.variant }}
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
          secrets: |
            r2_access_key=${{ secrets.R2_ACCESS_KEY_ID }}
            r2_secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Print pushed image
        run: echo "Pushed ${{ steps.meta.outputs.image }}"
