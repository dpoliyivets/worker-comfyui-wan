name: Build MiniMax H3 serverless image (lazy weights)

# Builds the MiniMax H3 serverless worker image from Dockerfile.h3-lazy.
# No baked weights → ~10 GB → builds and pushes on a stock ubuntu-latest runner
# (same as build-ltx-lazy.yml). The ref2va/fl2va split is an endpoint-env concern
# (H3_VARIANT), so ONE image serves every H3 endpoint; each worker downloads its
# variant's ~44 GB weight set at cold start (download-h3-weights.sh).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (default: short commit SHA)"
        required: false
        type: string

jobs:
  build-h3-lazy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          echo "image=${{ vars.DOCKERHUB_REPO }}/${{ vars.DOCKERHUB_IMG }}:h3-lazy-${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push H3 lazy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.h3-lazy
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Print pushed image
        run: echo "Pushed ${{ steps.meta.outputs.image }}"
