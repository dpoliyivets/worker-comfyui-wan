name: Copy LTX image to GHCR
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag to copy (e.g. ltx-lazy-d672b20)"
        required: true
        type: string
jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - name: Copy Docker Hub -> GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u ${{ github.actor }} --password-stdin
          SRC="docker.io/${{ vars.DOCKERHUB_REPO }}/${{ vars.DOCKERHUB_IMG }}:${{ inputs.tag }}"
          DST="ghcr.io/dpoliyivets/${{ vars.DOCKERHUB_IMG }}:${{ inputs.tag }}"
          echo "copying $SRC -> $DST"
          crane copy "$SRC" "$DST"
          echo "done: $DST"
